name: 예약발행 자동 처리

on:
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 실행 (GitHub Actions 최소 단위)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 예약된 글 발행
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://hswviuomhdimtilrcpr.supabase.co/functions/v1/publish-scheduled-posts" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")
          echo "HTTP 응답 코드: $response"
          # Edge Function이 없거나 예약 글이 없어도 워크플로우는 성공 처리
          exit 0
