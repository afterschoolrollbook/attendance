name: 예약발행 자동 처리

on:
  schedule:
    - cron: '* * * * *'  # 매 분마다 실행
  workflow_dispatch:       # 수동 실행 버튼도 활성화

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 예약된 글 발행
        run: |
          curl -s -X POST \
            "https://hswviuomhdimtilrcpr.supabase.co/functions/v1/publish-scheduled-posts" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
