  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js')
            console.log('[SW] 등록 완료:', reg.scope)

            // 새 SW 감지 → 사용자에게 업데이트 알림 (자동 새로고침 X)
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing
              if (!newSW) return
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] 업데이트 감지 — 사용자에게 알림')
                  // React 렌더 사이클 완료 후 이벤트 발생 (즉시 발생 시 렌더 방해 방지)
                  setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('sw-update-ready', { detail: { newSW } }))
                  }, 3000)
                }
              })
            })

            // SW 교체 완료 시 페이지 새로고침 — 사용자가 업데이트 버튼 눌렀을 때만
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              console.log('[SW] 새 버전 적용')
              if (window._swUpdateRequested) {
                window.location.reload()
              }
            })

            // 주기적 업데이트 체크 (5분마다)
            setInterval(() => reg.update(), 5 * 60 * 1000)

          } catch (err) {
            console.warn('[SW] 등록 실패:', err)
          }
        })
      }
    </script>
