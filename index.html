    <meta name="description" content="방과후 강사를 위한 스마트 출석 관리" />

    <!-- Google AdSense — 실제 퍼블리셔 ID로 교체 필요: ca-pub-XXXXXXXXXXXXXXXX -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Noto Sans KR', sans-serif; background: #f4f5f7; color: #1a1a2e; }
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    </style>

    <!-- PWA 설치 프롬프트 — 가능한 빨리 등록해야 타이밍을 놓치지 않음 -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        window._installPrompt = e
        console.log('[PWA] 설치 프롬프트 준비 완료')
      })
      window.addEventListener('appinstalled', () => {
        window._installPrompt = null
        console.log('[PWA] 설치 완료')
      })
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://accounts.google.com https://appleid.cdn-apple.com https://pagead2.googlesyndication.com https://*.google.com https://*.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.resend.com https://pagead2.googlesyndication.com https://*.google.com https://*.doubleclick.net https://cdnjs.cloudflare.com https://*.adtrafficquality.google https://api.open-meteo.com; frame-src 'self' blob: https://*.google.com https://*.doubleclick.net;">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js')
            console.log('[SW] 등록 완료:', reg.scope)

            // 새 SW 감지 → 즉시 교체 후 페이지 자동 새로고침
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing
              if (!newSW) return
              newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] 업데이트 감지 — 자동 새로고침')
                  newSW.postMessage('skipWaiting')
                }
              })
            })

            // SW 교체 완료 시 페이지 새로고침
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              console.log('[SW] 새 버전 적용 — 페이지 새로고침')
              window.location.reload()
            })

            // 주기적 업데이트 체크 (10분마다)
            setInterval(() => reg.update(), 10 * 60 * 1000)

          } catch (err) {
            console.warn('[SW] 등록 실패:', err)
          }
        })
      }
    </script>
  </body>
</html>
