## 같은 창의력 수업인데 왜 어떤 아이는 신나고, 어떤 아이는 멍할까?

방과후 수업을 하다 보면 이런 순간이 찾아옵니다. 분명히 잘 준비한 **초등 창의력 수업**인데, 1~2학년 아이들은 신이 나서 날뛰고, 5~6학년 아이들은 "이게 뭐야" 하는 표정으로 앉아 있죠. 반대로 고학년용 토론 활동에 저학년 아이들은 "무슨 말인지 모르겠어요"라고 합니다.

이유는 하나입니다. **초등 연령별 창의력 발달 단계**가 완전히 다르기 때문입니다. 같은 **창의력 수업**이라도 연령에 맞게 설계하지 않으면 효과는 절반 이하로 떨어집니다. 오늘은 저학년·중학년·고학년 각 시기의 **창의력 발달** 특징과 꼭 맞는 수업 설계법을 단계별로 안내해 드립니다.

### 초등 창의력 발달, 왜 단계가 중요한가요?

아이의 **창의력 발달**은 신체 발달처럼 단계적으로 성장합니다. 각 시기마다 가장 잘 반응하는 자극과 활동 방식이 따로 있으며, 이 흐름을 이해하는 것이 **연령별 맞춤 창의력 교육**의 출발점입니다.

## 초등 저학년(1~2학년) 창의력 발달 특징과 맞춤 수업법

### 저학년 창의력 발달의 핵심 특징

초등 1~2학년은 **창의력 발달 황금기**입니다. 현실과 상상의 경계가 희미해 아이디어가 넘치고, 실패를 두려워하지 않는 시기입니다. 이 시기에 자유로운 탐색 기회를 충분히 주는 것이 이후 **초등 창의력** 성장의 토대가 됩니다.

- **무한한 아이디어**: 현실과 상상의 경계가 희미해 기발한 발상이 쏟아집니다
- **과정 중심**: 결과보다 탐색과 놀이 자체를 즐기며 실패를 실패로 인식하지 않습니다
- **신체 연동 학습**: 몸을 움직이면서 배울 때 **초등 창의력**이 가장 잘 발휘됩니다
- **짧은 집중 시간**: 한 활동에 10~15분이 한계이므로 짧고 다양하게 구성해야 합니다

### 저학년 창의력 수업 추천 활동

- **자유 그리기 & 스토리 만들기**: "이 동물은 어디 살까? 이름은 뭐야?" 식의 열린 질문으로 상상력 자극
- **역할극 & 즉흥 놀이**: 대본 없이 즉흥으로 이야기를 만들며 **창의적 표현력** 기르기
- **감각 탐구 활동**: 만지고, 냄새 맡고, 소리를 듣고 느낌을 말로 표현하기
- **20분마다 활동 전환**: 집중력과 흥미를 동시에 유지하는 핵심 전략

## 초등 중학년(3~4학년) 창의력 발달 특징과 맞춤 수업법

### 중학년 창의력 발달의 핵심 특징

초등 3~4학년은 "왜?"라는 질문이 폭발적으로 늘어나는 시기입니다. 동시에 친구들의 평가를 의식하기 시작하면서 **창의력 수업**에서 "잘 해야 한다"는 부담이 처음 생깁니다. 명확한 목표와 성취감을 주는 활동이 이 시기 **창의력 발달**의 핵심입니다.

아래 표는 세 시기의 **연령별 창의력 발달 단계** 특징을 한눈에 정리한 것입니다.

| 비교 항목 | 저학년(1~2학년) | 중학년(3~4학년) | 고학년(5~6학년) |
|-----------|----------------|----------------|----------------|
| 창의력 발달 동기 | 재미, 즐거움 | 성취감, 친구 인정 | 자율성, 의미 추구 |
| 최적 집중 시간 | 10~15분 | 20~30분 | 30~40분 |
| 선호 활동 유형 | 자유 탐색·신체 놀이 | 목표 있는 협동 활동 | 프로젝트·토론·발표 |
| 실패에 대한 반응 | 별로 신경 쓰지 않음 | 좌절하거나 포기 | 원인 분석 시도 |

### 중학년 창의력 수업 추천 활동

- **미션형 창의 활동**: "주어진 재료로 물이 새지 않는 배 만들기"처럼 목표가 명확한 과제
- **협동 프로젝트**: 역할 분담을 스스로 정하고 함께 결과물을 만드는 경험
- **발표 & 공유**: 자신의 창의적 아이디어를 친구들 앞에서 말하는 연습으로 **창의적 자신감** 키우기

### 고학년 창의력 발달의 핵심 특징

초등 5~6학년은 **비판적 사고와 창의력**이 결합되는 시기입니다. "이게 과연 좋은 아이디어일까?"를 스스로 평가하기 시작하며, 이것이 진짜 **창의적 문제 해결력**으로 이어집니다.

function updateCount() {
  const raw = document.getElementById('fBody').value;
  const text = raw
    .replace(/<svg[\s\S]*?<\/svg>/gi, '')
    .replace(/^\|[\s\S]*?(?=\n\n|\n##|\n#|$)/gm, '')
    .replace(/!\[.*?\]\(.*?\)/g, '')
    .replace(/\[.*?\]\(.*?\)/g, '')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/\*{1,2}(.*?)\*{1,2}/g, '$1')
    .replace(/^[-*+]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/^>\s*/gm, '')
    .replace(/^[-|: ]+$/gm, '')
    .replace(/\|/g, ' ')
    .replace(/^---+$/gm, '')
    .replace(/`{1,3}[^`]*`{1,3}/g, '')
    .replace(/\n{2,}/g, '\n')
    .trim();
  const all = text.replace(/\s/g, '').length;
  const withSpace = text.length;
  document.getElementById('cAll').textContent = withSpace.toLocaleString();
  document.getElementById('cNoSpace').textContent = all.toLocaleString();
  const st = document.getElementById('cStatus');
  if (all === 0) { st.textContent = ''; return; }
  if (all < 900)        { st.style.color = '#ef4444'; st.textContent = '⚠️ 권장 900자 이상 (' + (900 - all) + '자 부족)'; }
  else if (all <= 1800) { st.style.color = '#16a34a'; st.textContent = '✅ 적정 분량'; }
  else                  { st.style.color = '#f97316'; st.textContent = '⚠️ 1800자 초과 (' + (all - 1800) + '자 넘음)'; }
}

function parseMarkdown(md) {
  if (!md) return '';
  const svgPlaceholders = [];
  let html = md.replace(/<svg[\s\S]*?<\/svg>/gi, (match) => {
    const fixed = match.includes('width=') ? match : match.replace('<svg', '<svg width="100%"');
    svgPlaceholders.push(fixed);
    return `%%SVG${svgPlaceholders.length - 1}%%`;
  });
  const codeBlocks = [];
  html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(`<pre><code>${code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
    return `%%CODE${codeBlocks.length - 1}%%`;
  });
  html = html.replace(
    /^(\|.+\|\n)([ \t]*\|[-| :\t]+\|\n)((?:\|.+\|\n?)*)/gm,
    (_, header, _sep, rows) => {
      const thCells = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const trRows = rows.trim().split('\n').filter(r => r.trim()).map(row => {
        const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      return `<table><thead><tr>${thCells}</tr></thead><tbody>${trRows}</tbody></table>\n`;
    }
  );
  html = html
    .replace(/^---$/gm, '<hr>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => `<div style="margin:8px 0;"><img src="${src}" alt="${alt}" style="max-width:100%;border-radius:8px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div style="display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff7ed;border:1.5px dashed #f97316;border-radius:8px;font-size:13px;color:#92400e;">🖼️ <div><strong>${alt||'이미지'}</strong><br><span style="font-size:11px;color:#b45309;">블로그에 붙여넣으면 정상 표시됩니다 ✅</span></div></div></div>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.split(/\n{2,}/).map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(h[1-3]|ul|ol|blockquote|hr|table|pre|img)/.test(block)) return block;
    if (/%%SVG\d+%%/.test(block) || /%%CODE\d+%%/.test(block)) return block;
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  html = html.replace(/%%CODE(\d+)%%/g, (_, i) => codeBlocks[i]);
  html = html.replace(/%%SVG(\d+)%%/g, (_, i) => svgPlaceholders[i]);
  return html;
}

function setStatus(msg, loading=false) {

}

function slugify(t) {
  return t.toLowerCase().replace(/[^\w가-힣\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').trim().slice(0,60);
}

function copyField(id, btnId) {

  navigator.clipboard.writeText(val).then(() => flash(btnId));
}

function copySelectText(id, btnId) {
  const el = document.getElementById(id);
  const val = el.options[el.selectedIndex]?.value || '';
  if (!val) return;
  navigator.clipboard.writeText(val).then(() => flash(btnId));
}

    ['태그',        document.getElementById('fTags').value],
  ];
  let text = parts.filter(([,v])=>v).map(([k,v])=>`[${k}]\n${v}`).join('\n\n');
  const body = document.getElementById('fBody').value;
  if (body) text += '\n\n[본문]\n' + body;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('pubBtn');
    const orig = btn.textContent;
    btn.textContent = '✅ 복사됨!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
}

function clearAll() {
  if (!confirm('모두 초기화할까요?')) return;
  ['fTitle','fSlug','fSummary','fImage','fTags','fBody'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCat').value = '';
  document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('topicInput').value = '';
  setStatus(''); updateCount();
}
</script>
</body>
